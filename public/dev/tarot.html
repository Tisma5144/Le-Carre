<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Apercu du Tarot</title>
<link rel="stylesheet" href="/vendor/fonts/playfair-display/latin-700.css" />
<link rel="stylesheet" href="/vendor/fonts/playfair-display/latin-900.css" />
<style>
  body { margin: 0; padding: 20px; background: #3a2616; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 10px; }
  canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .big { display: flex; gap: 20px; margin-bottom: 20px; }
  .big canvas { width: 240px; }
</style>
</head>
<body>
<div class="big" id="big"></div>
<div class="grid" id="grid"></div>
<script type="module">
  import { createCardFaceCanvas, createCardBackCanvas, createRankBadgeCanvas, ensureCardFonts, RANK_ORDER } from "/js/cards/cardArt.js";
  await ensureCardFonts();
  const params = new URLSearchParams(location.search);
  const big = document.getElementById("big");
  for (const c of [{ rank: "21", suit: "atout" }, { rank: "1", suit: "atout" }, { rank: "E", suit: "excuse" }, { rank: "C", suit: "coeur" }, { rank: "14", suit: "atout" }]) big.appendChild(createCardFaceCanvas(c, 1));
  const grid = document.getElementById("grid");
  for (let n = 1; n <= 21; n += 1) grid.appendChild(createCardFaceCanvas({ rank: String(n), suit: "atout" }, 0.6));
  for (const suit of ["pique", "coeur", "trefle", "carreau"]) grid.appendChild(createCardFaceCanvas({ rank: "C", suit }, 0.6));
  for (const r of ["1", "10", "V", "D", "R"]) grid.appendChild(createCardFaceCanvas({ rank: r, suit: "trefle" }, 0.6));
  document.body.dataset.ready = "1";
</script>
</body>
</html>
