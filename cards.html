<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Apercu du jeu de cartes</title>
<link rel="stylesheet" href="/vendor/fonts/playfair-display/latin-700.css" />
<link rel="stylesheet" href="/vendor/fonts/playfair-display/latin-900.css" />
<style>
  body { margin: 0; padding: 20px; background: #3a2616; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 10px; }
  canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .big { display: flex; gap: 20px; margin-bottom: 20px; }
  .big canvas { width: 240px; }
</style>
</head>
<body>
<div class="big" id="big"></div>
<div class="grid" id="grid"></div>
<script type="module">
  import { createCardFaceCanvas, createCardBackCanvas, createRankBadgeCanvas, ensureCardFonts, RANK_ORDER } from "/js/cards/cardArt.js";
  await ensureCardFonts();
  const params = new URLSearchParams(location.search);
  const big = document.getElementById("big");
  const focus = (params.get("big") || "R-coeur,D-trefle,V-carreau,A-pique,7-coeur").split(",");
  for (const f of focus) {
    const [rank, suit] = f.split("-");
    big.appendChild(createCardFaceCanvas({ rank, suit }, 1));
  }
  big.appendChild(createCardBackCanvas(1));
  big.appendChild(createRankBadgeCanvas("R", 240));
  const grid = document.getElementById("grid");
  for (const suit of ["pique", "coeur", "trefle", "carreau"]) {
    for (const rank of RANK_ORDER) grid.appendChild(createCardFaceCanvas({ rank, suit }, 0.6));
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
